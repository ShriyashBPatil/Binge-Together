<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=JetBrains+Mono:wght@600;700&amp;display=swap');
      .txt-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 18px; fill: #0f172a; }
      .txt-sub { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 13px; fill: #475569; }
      .txt-code { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; }
      .txt-chat { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; }
    </style>
    <filter id="shadow-sm" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#0f172a"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="600" fill="#f8fafc"/>

  <!-- Main Browser Window -->
  <g transform="translate(20, 20)">
    <rect width="960" height="560" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="3" filter="url(#shadow-sm)"/>

    <!-- Window Topbar -->
    <path d="M 0 14 C 0 6.27 6.27 0 14 0 L 946 0 C 953.73 0 960 6.27 960 14 L 960 40 L 0 40 Z" fill="#0f172a"/>
    <circle cx="24" cy="20" r="6" fill="#ef4444"/>
    <circle cx="44" cy="20" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="20" r="6" fill="#10b981"/>
    <rect x="250" y="8" width="460" height="24" rx="6" fill="#1e293b"/>
    <text x="480" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">https://bingetogether.local/room/cyber-chill-2026</text>

    <!-- Header Inside App -->
    <g transform="translate(20, 55)">
      <rect width="920" height="48" rx="8" fill="#ffd166" stroke="#0f172a" stroke-width="2.5" filter="url(#shadow-sm)"/>
      <text x="20" y="30" class="txt-title">🍿 MOVIE NIGHT: Interstellar (4K Stream)</text>
      <rect x="670" y="10" width="110" height="28" rx="6" fill="#06d6a0" stroke="#0f172a" stroke-width="2"/>
      <text x="725" y="28" text-anchor="middle" class="txt-code" fill="#0f172a">🟢 4 IN SYNC</text>
      <rect x="795" y="10" width="110" height="28" rx="6" fill="#ff6b6b" stroke="#0f172a" stroke-width="2"/>
      <text x="850" y="28" text-anchor="middle" class="txt-code" fill="#ffffff">HOST MODE</text>
    </g>

    <!-- Content Layout: Left Video & WebRTC, Right Chat -->
    <!-- Left Column (Width: 600) -->
    <g transform="translate(20, 118)">
      <!-- Video Player Frame -->
      <rect width="600" height="300" rx="10" fill="#020617" stroke="#0f172a" stroke-width="2.5" filter="url(#shadow-sm)"/>
      <!-- Video Graphic -->
      <circle cx="300" cy="140" r="36" fill="rgba(255, 255, 255, 0.15)" stroke="#ffffff" stroke-width="3"/>
      <polygon points="292,126 316,140 292,154" fill="#ffffff"/>
      <text x="300" y="200" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16" fill="#f8fafc">Interstellar.2014.1080p.mp4</text>
      <text x="300" y="222" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">HTTP 206 Partial Content Stream • Buffer: 100%</text>

      <!-- Video Controls Bar -->
      <rect x="15" y="255" width="570" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="30" y="277" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ffd166">⏸ PAUSE</text>
      <!-- Progress Bar -->
      <rect x="100" y="268" width="370" height="8" rx="4" fill="#334155"/>
      <rect x="100" y="268" width="220" height="8" rx="4" fill="#06d6a0"/>
      <circle cx="320" cy="272" r="6" fill="#ffd166"/>
      <text x="490" y="277" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e2e8f0">01:14:22 / 02:49:00</text>

      <!-- WebRTC Participants Strip -->
      <g transform="translate(0, 315)">
        <!-- Video Cam 1 (Host) -->
        <rect x="0" y="0" width="140" height="95" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="2" filter="url(#shadow-sm)"/>
        <circle cx="70" cy="40" r="20" fill="#f43f5e"/>
        <text x="70" y="47" text-anchor="middle" font-size="18">😎</text>
        <text x="70" y="80" text-anchor="middle" class="txt-code" fill="#f8fafc">Sahil (Host) 🎙️</text>

        <!-- Video Cam 2 -->
        <rect x="153" y="0" width="140" height="95" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="2" filter="url(#shadow-sm)"/>
        <circle cx="223" cy="40" r="20" fill="#8b5cf6"/>
        <text x="223" y="47" text-anchor="middle" font-size="18">🚀</text>
        <text x="223" y="80" text-anchor="middle" class="txt-code" fill="#f8fafc">Alex 🎙️</text>

        <!-- Video Cam 3 -->
        <rect x="306" y="0" width="140" height="95" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="2" filter="url(#shadow-sm)"/>
        <circle cx="376" cy="40" r="20" fill="#10b981"/>
        <text x="376" y="47" text-anchor="middle" font-size="18">🐱</text>
        <text x="376" y="80" text-anchor="middle" class="txt-code" fill="#f8fafc">Emma 🔇</text>

        <!-- Video Cam 4 -->
        <rect x="460" y="0" width="140" height="95" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="2" filter="url(#shadow-sm)"/>
        <circle cx="530" cy="40" r="20" fill="#f59e0b"/>
        <text x="530" y="47" text-anchor="middle" font-size="18">🍿</text>
        <text x="530" y="80" text-anchor="middle" class="txt-code" fill="#f8fafc">David 🎙️</text>
      </g>
    </g>

    <!-- Right Column: Live Chat & Event Logs (Width: 305) -->
    <g transform="translate(635, 118)">
      <rect width="305" height="410" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" filter="url(#shadow-sm)"/>
      
      <!-- Chat Header -->
      <path d="M 0 10 C 0 4.48 4.48 0 10 0 L 295 0 C 300.52 0 305 4.48 305 10 L 305 38 L 0 38 Z" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
      <text x="15" y="25" class="txt-title" font-size="14">💬 Room Chat</text>
      <circle cx="280" cy="20" r="5" fill="#10b981"/>

      <!-- Chat Messages -->
      <g transform="translate(15, 55)">
        <!-- Msg 1 -->
        <text x="0" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#0284c7">Alex <tspan font-weight="400" fill="#94a3b8">10:14 PM</tspan></text>
        <text x="0" y="32" class="txt-chat" fill="#1e293b">This docking scene is insane!! 🤯</text>

        <!-- System Pill -->
        <g transform="translate(0, 48)">
          <rect width="275" height="24" rx="12" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
          <text x="137" y="16" text-anchor="middle" class="txt-code" font-size="10" fill="#92400e">⚡ Emma synced seek to 01:14:20</text>
        </g>

        <!-- Msg 2 -->
        <g transform="translate(0, 85)">
          <text x="0" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#e11d48">Sahil (Host) <tspan font-weight="400" fill="#94a3b8">10:15 PM</tspan></text>
          <text x="0" y="32" class="txt-chat" fill="#1e293b">Hans Zimmer's soundtrack is 10/10 🎵</text>
        </g>

        <!-- Msg 3 -->
        <g transform="translate(0, 135)">
          <text x="0" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#16a34a">Emma <tspan font-weight="400" fill="#94a3b8">10:15 PM</tspan></text>
          <text x="0" y="32" class="txt-chat" fill="#1e293b">Agreed!! Can we turn up the volume?</text>
        </g>
      </g>

      <!-- Chat Input Box -->
      <g transform="translate(12, 355)">
        <rect width="280" height="42" rx="8" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
        <text x="12" y="26" class="txt-sub" fill="#94a3b8">Type a message...</text>
        <rect x="232" y="6" width="42" height="30" rx="6" fill="#ffd166" stroke="#0f172a" stroke-width="1.5"/>
        <text x="253" y="25" text-anchor="middle" font-size="14">➤</text>
      </g>
    </g>
  </g>
</svg>
